:root{
  --night:#130f30;--night2:#211849;--violet:#3a2a78;--lav:#B9A4FF;--lav2:#8E78E8;--gold:#F4C86A;--gold2:#D9A441;--cyan:#7EE7FF;
  --ink:#F5F1FF;--muted:#C8BFE9;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.12);--line:rgba(244,200,106,.38);
  --ok:#5CE1A0;--bad:#FF7A9A;
  --title:'Philosopher',Georgia,serif;--sans:'Montserrat','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
body{font-family:var(--sans);color:var(--ink);font-weight:500}
button{font-family:inherit;color:inherit}
input{-webkit-user-select:text;user-select:text}
#nojs{position:fixed;top:0;right:0;bottom:0;left:0;z-index:99;background:#fff;color:#222;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;font:600 24px/1.5 Arial,sans-serif}

#app{position:fixed;top:0;left:0;width:1366px;height:768px;transform-origin:0 0;-webkit-user-select:none;user-select:none;
  display:grid;grid-template-rows:64px 1fr 62px;grid-template-columns:1fr 280px;
  background:radial-gradient(ellipse at 50% 0%,#4a3796 0%,#2a1f5e 38%,#16113a 75%,#0f0c28 100%)}
#app.noboard{grid-template-columns:1fr 0}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(10,8,30,.55);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--title);font-weight:700;font-size:21px;color:var(--gold);white-space:nowrap;text-shadow:0 0 12px rgba(244,200,106,.45)}
.brand svg{width:30px;height:30px}
.keybar{display:flex;align-items:center;gap:5px;margin-left:14px;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(185,164,255,.3)}
.keybar .kl{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px;letter-spacing:.06em;text-transform:uppercase}
.ks{width:30px;height:34px;border-radius:7px;border:1px dashed rgba(185,164,255,.45);display:grid;place-items:center;font-family:var(--title);font-weight:700;font-size:20px;color:var(--gold)}
.ks.on{border:1px solid var(--gold);background:radial-gradient(circle,rgba(244,200,106,.35),rgba(244,200,106,.08));box-shadow:0 0 12px rgba(244,200,106,.55);animation:popin .6s both}
.hsp{flex:1}
.hb{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:10px;border:1px solid rgba(185,164,255,.35);background:rgba(255,255,255,.06);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.hb svg{width:18px;height:18px;flex:none}
.hb:hover{border-color:var(--gold)}
.hb.on{background:var(--gold);color:#2a1f5e;border-color:var(--gold)}
#timer.run{border-color:var(--cyan);color:var(--cyan)}
#timer.done{border-color:var(--bad);color:var(--bad);animation:blink 1s infinite}
#stage{grid-row:2;grid-column:1;position:relative;overflow:hidden;overflow:clip}
#sky{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#board{grid-row:2;grid-column:2;background:rgba(10,8,30,.45);border-left:1px solid rgba(185,164,255,.25);padding:14px 12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
#app.noboard #board{display:none}
footer{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(10,8,30,.55);border-top:1px solid var(--line);z-index:5}
.nav{height:42px;padding:0 22px;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;border:1px solid var(--gold);background:linear-gradient(180deg,#F7D58A,var(--gold2));color:#2a1f5e;box-shadow:0 0 14px rgba(244,200,106,.35)}
.nav.prev{background:rgba(255,255,255,.06);color:var(--ink);border-color:rgba(185,164,255,.4);box-shadow:none}
.nav:disabled{opacity:.35;cursor:default}
#sections{flex:1;display:flex;gap:2px;justify-content:center}
.sec{border:none;background:none;font-weight:600;font-size:13px;color:var(--muted);padding:10px 9px 8px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.sec.on{color:var(--gold);border-bottom-color:var(--gold)}
.sec.done{color:var(--ink)}
#counter{font-weight:600;color:var(--muted);font-size:14px;min-width:60px;text-align:center}
#progress{position:absolute;left:0;bottom:62px;height:3px;background:linear-gradient(90deg,var(--lav),var(--gold));box-shadow:0 0 8px var(--gold);transition:width .5s;z-index:6}

/* слайды */
.slide{position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;padding:18px 30px;display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:scale(.97);visibility:hidden;pointer-events:none;transition:opacity .6s ease,transform .6s ease,visibility 0s linear .6s}
.slide.active{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition:opacity .6s ease,transform .6s ease,visibility 0s}
.inner{margin:auto;width:100%;max-width:1020px}
.center{text-align:center}
h1,h2,h3,p{margin:0}
.kicker{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.h2{font-family:var(--title);font-weight:700;font-size:46px;color:var(--gold);line-height:1.1;text-shadow:0 0 18px rgba(244,200,106,.35);margin:6px 0 14px}
.lead{font-size:19px;color:var(--muted);line-height:1.5}
.glass{background:var(--card);border:1px solid rgba(185,164,255,.3);border-radius:16px;padding:20px 24px;box-shadow:0 10px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.orn{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--gold);margin:12px auto}
.orn i{display:block;height:1px;width:160px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.orn svg{width:30px;height:30px}

/* титульный */
.title-scene{position:absolute;top:0;left:0;width:100%;height:100%}
.t-wrap{position:relative;z-index:2;text-align:center;margin-top:18px}
.t-title{font-family:var(--title);font-weight:700;font-size:70px;line-height:1.02;color:#FFE7A8;text-shadow:0 0 24px rgba(244,200,106,.7),0 2px 0 rgba(0,0,0,.3);margin:8px 0}
.t-sub{font-size:18px;color:var(--ink);opacity:.92}
.plates{position:absolute;z-index:2;left:0;right:0;bottom:18px;display:flex;gap:12px;justify-content:center}
.plate{padding:9px 20px;border-radius:12px;background:rgba(19,15,48,.7);border:1px solid var(--pc);box-shadow:0 0 14px var(--pc);font-weight:700;font-size:20px}
.float{animation:float 5s ease-in-out infinite}
.float.d1{animation-delay:-1.2s}.float.d2{animation-delay:-2.4s}.float.d3{animation-delay:-3.6s}
.glow{animation:glow 3s ease-in-out infinite}

/* цели и правила */
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.goal h3{font-family:var(--title);font-size:25px;color:var(--c);margin-bottom:8px}
.goal p{font-size:16.5px;line-height:1.5;color:var(--ink)}
.epi{margin-top:20px;text-align:center;font-family:var(--title);font-size:28px;color:#FFE7A8}
.epi small{display:block;font-family:var(--sans);font-size:15px;color:var(--muted);margin-top:4px}
.rgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:start}
.rules{margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.45;margin:9px 0}
.rules li b.n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(244,200,106,.15);border:1px solid var(--gold);color:var(--gold);font-family:var(--title);font-size:16px}
.glass h3{font-family:var(--title);font-size:24px;color:var(--gold);margin-bottom:8px}
.pedit{display:flex;gap:8px;align-items:center;margin:8px 0}
.pedit .dot{width:10px;height:36px;border-radius:4px;background:var(--pc);box-shadow:0 0 10px var(--pc);flex:none}
.pedit input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:19px;padding:7px 12px;border-radius:10px;border:1px solid rgba(185,164,255,.4);background:rgba(255,255,255,.08);color:var(--ink)}
.pedit input:focus{outline:none;border-color:var(--gold)}
.xbtn{border:1px solid rgba(255,122,154,.5);background:rgba(255,122,154,.08);color:var(--bad);font-weight:700;border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:16px}
.xbtn.arm{background:var(--bad);color:#fff;width:auto;padding:0 10px;font-size:14px}
.ghost{border:1px dashed rgba(185,164,255,.5);background:none;border-radius:10px;padding:9px;width:100%;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;margin-top:4px}
.small{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4}
.reset{margin-top:10px;border:1px solid rgba(255,122,154,.45);background:rgba(255,122,154,.08);color:var(--bad);border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px;cursor:pointer;width:100%}
.reset.armed{background:var(--bad);color:#fff}

/* карта */
.mapwrap{position:relative}
.mapwrap svg{width:100%;display:block}
.m-st{cursor:default}
.m-st .ring{fill:none;stroke:var(--gold);stroke-width:2;opacity:0}
.m-st.cur .ring{opacity:1;animation:ringp 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.legend{display:flex;gap:18px;justify-content:center;margin-top:6px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}

/* станция */
.st-grid{display:grid;grid-template-columns:560px 1fr;gap:28px;align-items:center}
.scene{width:560px;height:380px;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 0 40px rgba(126,231,255,.12),0 20px 50px rgba(0,0,0,.35)}
.scene svg{width:100%;height:100%;display:block}
.st-num{font-family:var(--title);font-size:22px;color:var(--cyan)}
.st-name{font-family:var(--title);font-weight:700;font-size:46px;line-height:1.05;color:var(--gold);text-shadow:0 0 18px rgba(244,200,106,.4);margin:6px 0 4px}
.st-topic{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lav)}
.st-desc{font-size:19px;line-height:1.5;margin:14px 0 16px}
.st-meta{display:flex;gap:10px;flex-wrap:wrap}
.mini svg{width:100%;height:auto;max-height:200px;display:block}
.pill{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(185,164,255,.35);font-size:14px;font-weight:600}

/* вопрос */
.qwrap{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;gap:12px;align-items:center}
.tag{padding:7px 14px;border-radius:999px;background:rgba(126,231,255,.12);border:1px solid rgba(126,231,255,.45);color:var(--cyan);font-weight:700;font-size:14px}
.qnum{font-weight:600;color:var(--muted);font-size:14px}
.turn{margin-left:auto;padding:6px 14px;border-radius:999px;border:1px solid var(--pc);box-shadow:0 0 12px var(--pc);font-weight:700;font-size:16px}
.turn b{color:#fff}
.qtext{font-family:var(--title);font-weight:700;font-size:40px;line-height:1.2;text-align:center;color:#fff;margin:6px 0}
.opts{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:14px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid rgba(185,164,255,.4);background:rgba(255,255,255,.07);font-size:24px;font-weight:700;cursor:pointer;text-align:left;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.opt:hover{transform:translateY(-2px);border-color:var(--gold)}
.opt .L{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(244,200,106,.15);border:1px solid var(--gold);color:var(--gold);font-family:var(--title);font-size:18px}
.opt.picked{border-color:var(--cyan);background:rgba(126,231,255,.12);box-shadow:0 0 16px rgba(126,231,255,.35)}
.opt.correct{border-color:var(--ok);background:rgba(92,225,160,.16);box-shadow:0 0 22px rgba(92,225,160,.5);animation:popin .5s}
.opt.correct .L{background:var(--ok);color:#12301f;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:rgba(255,122,154,.13);animation:shake .45s}
.qact{display:flex;gap:12px;justify-content:center}
.btn{height:42px;padding:0 18px;border-radius:10px;border:1px solid rgba(185,164,255,.45);background:rgba(255,255,255,.07);font-weight:700;font-size:15px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,#F7D58A,var(--gold2));color:#2a1f5e;border-color:var(--gold)}
.btn.cyan{background:rgba(126,231,255,.15);border-color:var(--cyan);color:var(--cyan)}
.btn:disabled{opacity:.4;cursor:default}
.note{padding:11px 16px;border-radius:12px;font-size:18px;line-height:1.45;animation:rise .35s both}
.note.hint{background:rgba(244,200,106,.1);border:1px solid rgba(244,200,106,.4)}
.note.ex{background:rgba(92,225,160,.1);border:1px solid rgba(92,225,160,.45)}
.award{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.aw-label{font-weight:600;color:var(--muted);font-size:14px}
.aw{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--pc);background:rgba(255,255,255,.05);font-weight:700;font-size:15px;cursor:pointer}
.aw.on{background:var(--pc);color:#fff;box-shadow:0 0 14px var(--pc)}
.aw.suggest{animation:pulse 1s infinite}
[hidden]{display:none!important}

/* пословица */
.pv-line{min-height:74px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:14px;border-radius:16px;border:1px dashed rgba(244,200,106,.55);background:rgba(244,200,106,.05)}
.pv-line.ok{border:1px solid var(--ok);background:rgba(92,225,160,.12);box-shadow:0 0 24px rgba(92,225,160,.35)}
.pv-line.bad{animation:shake .45s;border-color:var(--bad)}
.pv-line .ph{color:var(--muted);font-size:16px}
.pv-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:60px}
.chip{padding:10px 18px;border-radius:12px;border:1px solid rgba(185,164,255,.5);background:rgba(255,255,255,.08);font-family:var(--title);font-weight:700;font-size:28px;cursor:pointer;transition:transform .15s}
.chip:hover{transform:translateY(-2px);border-color:var(--gold)}
.pv-line .chip{border-color:var(--gold);background:rgba(244,200,106,.14);color:#FFE7A8;animation:popin .3s}

/* награда */
.rw-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
.runes{display:flex;gap:24px;justify-content:center;margin:20px 0}
.rune{width:130px;height:160px;perspective:700px}
.rune .in{position:relative;width:100%;height:100%;transition:transform 1s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.rune.open .in{transform:rotateY(180deg)}
.rune .f,.rune .b{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:18px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.rune .f{background:radial-gradient(circle at 50% 40%,#5a43b8,#2a1f5e);border:2px solid var(--lav);box-shadow:0 0 24px rgba(185,164,255,.5);color:var(--lav);font-size:54px}
.rune .b{transform:rotateY(180deg);background:radial-gradient(circle at 50% 40%,#FFF3C9,#F4C86A 55%,#C48A28);border:2px solid #FFE7A8;box-shadow:0 0 40px rgba(244,200,106,.8);font-family:var(--title);font-weight:700;font-size:86px;color:#3a2a78}

/* ворота */
.gate-grid{display:grid;grid-template-columns:420px 1fr;gap:26px;align-items:center}
.gatebox{position:relative;width:420px;height:480px}
.gatebox svg.gs{position:absolute;top:0;left:0;width:100%;height:100%}
.door{position:absolute;top:190px;width:110px;height:250px;background:linear-gradient(180deg,#5a3d22,#3d2814);border:3px solid #C48A28;transition:transform 2.2s cubic-bezier(.4,.1,.2,1);z-index:2}
.door::after{content:"";position:absolute;top:110px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.door.l{left:100px;border-radius:55px 0 0 0;transform-origin:left center}
.door.l::after{right:10px}
.door.r{left:210px;border-radius:0 55px 0 0;transform-origin:right center}
.door.r::after{left:10px}
.gatebox{perspective:900px}
.gatebox.open .door.l{transform:rotateY(-75deg)}
.gatebox.open .door.r{transform:rotateY(75deg)}
.gatelight{position:absolute;left:100px;top:190px;width:220px;height:250px;border-radius:110px 110px 0 0;background:radial-gradient(ellipse at 50% 60%,#FFF6D6,#F4C86A 45%,rgba(244,200,106,0) 75%);opacity:0;transition:opacity 2s;z-index:1}
.gatebox.open .gatelight{opacity:1}
.gatebox svg.lock{position:absolute;left:186px;top:290px;width:48px;height:56px;z-index:3;transition:opacity .6s,transform .6s}
.gatebox.open svg.lock{opacity:0;transform:translateY(30px) rotate(20deg)}
.slots{display:flex;gap:8px;justify-content:center;margin:12px 0}
.slot{width:62px;height:76px;border-radius:12px;border:1px dashed rgba(244,200,106,.6);display:grid;place-items:center;font-family:var(--title);font-weight:700;font-size:44px;color:#FFE7A8;cursor:pointer;background:rgba(244,200,106,.05)}
.slot.f{border-style:solid;background:rgba(244,200,106,.16);box-shadow:0 0 14px rgba(244,200,106,.4);animation:popin .3s}
.slots.ok .slot{border-color:var(--ok);background:rgba(92,225,160,.18);box-shadow:0 0 20px rgba(92,225,160,.6);color:#fff}
.slots.bad{animation:shake .5s}
.pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:80px}
.tile{width:62px;height:76px;border-radius:12px;border:1px solid var(--lav);background:radial-gradient(circle at 50% 40%,#5a43b8,#2a1f5e);box-shadow:0 0 14px rgba(185,164,255,.45);font-family:var(--title);font-weight:700;font-size:40px;color:#FFE7A8;cursor:pointer}
.tile:hover{transform:translateY(-3px)}
.tile.used{visibility:hidden}

/* итоги */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:8px 0 6px}
.pcol{display:flex;flex-direction:column;align-items:center;width:210px}
.pname{font-weight:700;font-size:26px;text-align:center}
.pstars{font-size:16px;color:var(--gold);margin:2px 0 8px;font-weight:700}
.pblock{width:100%;border-radius:12px 12px 0 0;display:flex;justify-content:center;padding-top:12px;font-family:var(--title);font-weight:700;font-size:46px;color:#2a1f5e;height:0;transition:height 1.2s cubic-bezier(.2,.9,.2,1)}
.pl1{background:linear-gradient(#FFE7A8,var(--gold2));box-shadow:0 0 30px rgba(244,200,106,.6)}
.pl2{background:linear-gradient(#E9E4FF,#A99BD8)}.pl3{background:linear-gradient(#F1C9A8,#C48A5E)}
.keyword{font-family:var(--title);font-weight:700;font-size:54px;letter-spacing:.18em;color:#FFE7A8;text-shadow:0 0 24px rgba(244,200,106,.8)}
.closing{max-width:900px;margin:10px auto 0;font-size:19px;line-height:1.55;text-align:center}

/* звёзды */
.bh{font-family:var(--title);font-weight:700;font-size:21px;color:var(--gold)}
#boardList{position:relative;flex:none}
.row{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(185,164,255,.3);border-left:4px solid var(--pc);transition:transform .6s cubic-bezier(.3,1.2,.5,1)}
.row .pl{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);border:1px solid rgba(185,164,255,.4);flex:none}
.row .pl.p1{background:var(--gold);color:#2a1f5e;border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.row .pl.p2{background:#C9C2EA;color:#2a1f5e}.row .pl.p3{background:#D9A07A;color:#2a1f5e}
.row .nm{flex:1;min-width:0;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sc{font-family:var(--title);font-weight:700;font-size:26px;color:var(--gold);min-width:46px;text-align:right}
.row .sc::after{content:" ★";font-size:15px}
.row.bump .sc{animation:bump .6s}
.row .adj{display:flex;flex-direction:column;gap:2px}
.row .adj button{border:1px solid rgba(185,164,255,.35);background:rgba(255,255,255,.05);border-radius:5px;width:24px;height:21px;cursor:pointer;font-size:9px;color:var(--muted);padding:0}
.bfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.bnote{font-size:12px;color:var(--muted);line-height:1.4;text-align:center}
.floater{position:fixed;font-family:var(--title);font-weight:700;color:var(--gold);pointer-events:none;animation:floatUp 1.3s forwards;z-index:60;text-shadow:0 0 10px var(--gold)}

.overlay{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(8,6,24,.6);z-index:40;display:flex;align-items:center;justify-content:center;animation:fade .2s}
.modal{background:linear-gradient(180deg,#2e2366,#1b1544);border:1px solid var(--gold);border-radius:18px;padding:28px 40px;min-width:500px;text-align:center;box-shadow:0 0 40px rgba(244,200,106,.3)}
.modal h3{font-family:var(--title);font-size:28px;color:var(--gold)}
.pk-name{font-family:var(--title);font-weight:700;font-size:72px;margin:18px 0 22px;color:#fff;text-shadow:0 0 20px var(--pc)}

@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(var(--r,0deg))}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes popin{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(244,200,106,.9)}50%{box-shadow:0 0 0 9px rgba(244,200,106,0)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.4)}}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes blink{50%{opacity:.5}}
@keyframes fade{from{opacity:0}}
@keyframes ringp{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
</style>

<script>
(function(){
"use strict";
/* ============ МАСШТАБ И ЗАЩИТА ============ */
let SCALE=1;
function fitApp(){const W=window.innerWidth||1366,H=window.innerHeight||768;SCALE=Math.max(.2,Math.min(W/1366,H/768));
  const a=document.getElementById('app');a.style.width=(W/SCALE)+'px';a.style.height=(H/SCALE)+'px';a.style.transform='scale('+SCALE+')';}
fitApp();
document.addEventListener('click',e=>{const b=e.target&&e.target.closest?e.target.closest('button'):null;if(b)setTimeout(()=>b.blur(),0);});
document.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(e.key===' '||e.key==='Enter')e.preventDefault();},true);

/* ============ ДАННЫЕ ============ */
const COLORS=['#7EE7FF','#FF8FB1','#B9A4FF','#5CE1A0','#F4C86A','#FFA36B'];
const DEFAULT_NAMES=['Аян','Шынғысхан','Никита'];
const LETTERS=['А','Б','В'];
const KEY='ЕДИНСТВО';
const SECTIONS=[{id:'start',label:'Начало',min:4},{id:'s1',label:'Лес Звуков',min:8},{id:'s2',label:'Река Слов',min:8},
  {id:'s3',label:'Город Частей речи',min:8},{id:'s4',label:'Мост Пословиц',min:8},{id:'gate',label:'Ворота',min:3},{id:'end',label:'Итоги',min:6}];
const STATIONS=[
 {id:'s1',num:1,name:'Лес Звуков и Букв',topic:'Фонетика и орфография',keeper:'Хранитель Леса',letters:['Т','Е'],scene:'forest',
  desc:'В этом лесу живут звуки и буквы. Ответьте на вопросы, и Хранитель Леса подарит вам две волшебные буквы ключевого слова.',

function starsSVG(n,w,h,seed){let s='',x=seed||7;const r=()=>{x=(x*9301+49297)%233280;return x/233280;};

    s+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="#fff" style="animation:twinkle ${(2+r()*3).toFixed(1)}s ${d}s infinite"/>`;}return s;}

  <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-family="Philosopher,serif" font-weight="700" font-size="${sz*.9}" fill="${col}">${ch}</text></g>`;}
function castle(x,y,s,lit){const w=lit?'#FFE7A8':'#B9A4FF';return `<g transform="translate(${x},${y}) scale(${s})" fill="#2a1f5e" stroke="#B9A4FF" stroke-width="1.2" stroke-opacity=".5">

function buildQ(q,qid,S,qi,turnIdx){
  const w=el(`<div class="qwrap">
    <div class="qhead"><span class="tag">Станция ${S.num} · ${esc(S.name)}</span><span class="qnum">Вопрос ${qi+1} из ${S.qs.length}</span><span class="turn" data-turn="${turnIdx}">Отвечает: <b></b></span></div>

    <div class="opts" style="--cols:${q.o.some(o=>o.length>14)?3:3}">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="qact"><button class="btn" data-h>Подсказка</button><button class="btn gold" data-r>Показать ответ</button></div>
    <div class="note hint" hidden>${esc(q.hint)}</div>
    <div class="note ex" hidden><b>${LETTERS[q.a]}) ${esc(q.o[q.a])}.</b> ${esc(q.ex)}</div>
    <div class="award" data-qid="${qid}"></div>
  </div>`);
  const opts=[...w.querySelectorAll('.opt')];let rev=false;
  opts.forEach(b=>b.addEventListener('click',()=>{if(rev)return;opts.forEach(x=>x.classList.remove('picked'));b.classList.add('picked');sfx('tick');}));
  w.querySelector('[data-h]').addEventListener('click',()=>{w.querySelector('.note.hint').hidden=false;});
  w.querySelector('[data-r]').addEventListener('click',()=>{if(rev)return;rev=true;const pk=opts.findIndex(x=>x.classList.contains('picked'));
    opts[q.a].classList.add('correct');if(pk>=0&&pk!==q.a)opts[pk].classList.add('wrong');
    w.querySelector('.note.hint').hidden=true;w.querySelector('.note.ex').hidden=false;
    if(pk===q.a){sfx('correct');confetti(50);const t=(+w.querySelector('[data-turn]').dataset.turn)%N();const b=w.querySelector(`.aw[data-p="${t}"]`);if(b&&!b.classList.contains('on'))b.classList.add('suggest');}
    else sfx(pk>=0?'wrong':'reveal');});
  renderAward(w.querySelector('.award'));return w;
}
function renderAward(box){const qid=box.dataset.qid,aw=state.awards[qid]||{};
  box.innerHTML='<span class="aw-label">Звезду получает:</span>'+state.names.map((n,i)=>`<button class="aw ${aw[i]?'on':''}" style="--pc:${pc(i)}" data-p="${i}">${aw[i]?'✓':'+'} ★ ${esc(nm(i))}</button>`).join('');
  box.querySelectorAll('.aw').forEach(b=>b.addEventListener('click',()=>{const p=+b.dataset.p,a=state.awards[qid]||(state.awards[qid]={});
    if(a[p]){addScore(p,-1);delete a[p];}else{a[p]=1;addScore(p,1);sfx('coin');}save();renderAward(box);}));}

/* ============ ПОСЛОВИЦА ============ */
function buildPV(p,qid,S,pi,turnIdx){
  const w=el(`<div class="qwrap">
    <div class="qhead"><span class="tag">Станция ${S.num} · ${esc(S.name)}</span><span class="qnum">Пословица ${pi+1} из ${S.pv.length}</span><span class="turn" data-turn="${turnIdx}">Собирает: <b></b></span></div>
    <div class="qtext" style="font-size:32px">Соберите пословицу из слов</div>
    <div class="pv-line"><span class="ph">Нажимайте на слова по порядку</span></div>
    <div class="pv-pool">${p.sh.map(i=>`<button class="chip" data-i="${i}">${esc(p.w[i])}</button>`).join('')}</div>
    <div class="qact"><button class="btn" data-c>Начать заново</button><button class="btn gold" data-r>Показать ответ</button></div>
    <div class="note ex" hidden><b>${esc(p.w.join(' ').replace(/,$/,''))}.</b> ${esc(p.ex)}</div>
    <div class="award" data-qid="${qid}"></div>
  </div>`);
  const line=w.querySelector('.pv-line'),pool=w.querySelector('.pv-pool');let seq=[],done=false;
  function draw(){line.innerHTML=seq.length?seq.map((i,k)=>`<button class="chip" data-k="${k}">${esc(p.w[i])}</button>`).join(''):'<span class="ph">Нажимайте на слова по порядку</span>';
    pool.querySelectorAll('.chip').forEach(c=>{c.hidden=seq.includes(+c.dataset.i);});
    line.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{if(done)return;seq.splice(+c.dataset.k,1);draw();}));}
  function finish(ok){done=true;line.classList.add('ok');w.querySelector('.note.ex').hidden=false;if(ok){sfx('correct');confetti(50);const t=(+w.querySelector('[data-turn]').dataset.turn)%N();const b=w.querySelector(`.aw[data-p="${t}"]`);if(b&&!b.classList.contains('on'))b.classList.add('suggest');}else sfx('reveal');}
  pool.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{if(done)return;seq.push(+c.dataset.i);sfx('tick');draw();
    if(seq.length===p.w.length){const txt=seq.map(i=>p.w[i]).join(' ');if(txt===p.w.join(' '))finish(true);else{line.classList.remove('bad');void line.offsetWidth;line.classList.add('bad');sfx('wrong');setTimeout(()=>{if(!done){seq=[];draw();}},900);}}}));
  w.querySelector('[data-c]').addEventListener('click',()=>{if(done)return;seq=[];draw();});
  w.querySelector('[data-r]').addEventListener('click',()=>{if(done)return;seq=p.w.map((_,i)=>i);draw();finish(false);});
  renderAward(w.querySelector('.award'));return w;
}

  master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  // простое «эхо» для волшебного звучания
  const dl=AC.createDelay(1);dl.delayTime.value=.28;const fb=AC.createGain();fb.gain.value=.32;const wet=AC.createGain();wet.gain.value=.35;
  dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);rev=dl;
  musicGain=AC.createGain();musicGain.gain.value=0;musicGain.connect(master);musicGain.connect(rev);
  sfxGain=AC.createGain();sfxGain.gain.value=.55;sfxGain.connect(master);sfxGain.connect(rev);}
  if(AC.state==='suspended')AC.resume();return AC;}
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(m,t,d,o){o=o||{};const osc=AC.createOscillator(),g=AC.createGain();osc.type=o.type||'sine';osc.frequency.setValueAtTime(hz(m),t);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(o.vol||.3,t+(o.attack||.006));g.gain.exponentialRampToValueAtTime(.0005,t+d);
  osc.connect(g);g.connect(o.dest||sfxGain);osc.start(t);osc.stop(t+d+.05);}
let NB=null;
function noise(t,d,vol,dest,hp){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}
  const src=AC.createBufferSource();src.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=hp||1200;const g=AC.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+d*.4);g.gain.exponentialRampToValueAtTime(.0005,t+d);src.connect(f);f.connect(g);g.connect(dest||sfxGain);src.start(t);src.stop(t+d+.02);}
function sfx(n){if(!snd.sfx||!ac())return;const t=AC.currentTime+.01;
  switch(n){
    case 'correct':[72,76,79,84].forEach((m,i)=>tone(m,t+i*.07,.6,{vol:.24}));break;
    case 'wrong':tone(57,t,.3,{type:'triangle',vol:.25});tone(53,t+.2,.5,{type:'triangle',vol:.25});break;
    case 'reveal':tone(81,t,.5,{vol:.18});tone(88,t+.08,.6,{vol:.14});break;
    case 'coin':tone(88,t,.15,{vol:.18});tone(95,t+.08,.6,{vol:.16});break;
    case 'tick':tone(96,t,.05,{vol:.05});break;
    case 'magic':[69,72,76,81,84,88,93,96].forEach((m,i)=>tone(m,t+i*.06,.9,{vol:.15}));break;
    case 'whoosh':noise(t,.6,.25,sfxGain,900);break;
    case 'gate':tone(45,t,2.8,{type:'triangle',vol:.3});tone(52,t,2.8,{type:'triangle',vol:.2});[69,72,76,81,84,88].forEach((m,i)=>tone(m,t+.4+i*.12,1.4,{vol:.14}));
      [81,84,88,93].forEach(m=>tone(m,t+1.3,2.2,{vol:.08}));break;
  }}
const CH=[[57,64,69,72,76,72,69,64],[57,64,69,72,76,72,69,64],[53,60,65,69,72,69,65,60],[53,60,65,69,72,69,65,60],
          [48,55,60,64,67,64,60,55],[48,55,60,64,67,64,60,55],[55,62,67,71,74,71,67,62],[52,59,64,68,71,68,64,59]];
const MEL=[76,null,null,72,74,null,72,null, 69,null,null,null,null,null,null,null, 72,null,null,69,72,null,77,null, 76,null,null,null,null,null,null,null,
           79,null,null,76,72,null,76,null, 74,null,null,null,72,null,null,null, 71,null,72,null,74,null,null,null, 68,null,null,null,null,null,null,null];
const EIGHTH=60/80/2;let mStep=0,mNext=0,mTimer=null;
function schedMusic(){while(mNext<AC.currentTime+.3){const i=mStep%64,bar=Math.floor(i/8),pos=i%8,t=mNext;
    tone(CH[bar][pos]+12,t,EIGHTH*3,{vol:.05,dest:musicGain});
    if(pos===0){tone(CH[bar][0]-12,t,EIGHTH*8,{type:'triangle',vol:.16,attack:.2,dest:musicGain});[CH[bar][1],CH[bar][2],CH[bar][3]].forEach(n=>tone(n,t,EIGHTH*8.5,{type:'triangle',vol:.025,attack:.5,dest:musicGain}));}
    const m=MEL[i];if(m!=null){let len=1;while(len<6&&MEL[(i+len)%64]==null)len++;tone(m+12,t,EIGHTH*len*1.2,{vol:.11,dest:musicGain});}
    mStep++;mNext+=EIGHTH;}}
function drawSnd(){$('#musBtn').classList.toggle('on',snd.music);$('#musBtn').lastElementChild.textContent=snd.music?'Музыка вкл.':'Музыка';
  $('#sfxWave').setAttribute('d',snd.sfx?'M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14':'M23 9l-6 6M17 9l6 6');$('#sfxLbl').textContent=snd.sfx?'Звуки':'Звуки выкл.';}
function toggleMusic(){if(!ac())return;snd.music=!snd.music;const now=AC.currentTime;musicGain.gain.cancelScheduledValues(now);musicGain.gain.setValueAtTime(musicGain.gain.value,now);
  if(snd.music){musicGain.gain.linearRampToValueAtTime(.8,now+1);if(!mTimer){mNext=now+.1;mTimer=setInterval(schedMusic,50);}}
  else{musicGain.gain.linearRampToValueAtTime(0,now+.7);setTimeout(()=>{if(!snd.music&&mTimer){clearInterval(mTimer);mTimer=null;}},800);}drawSnd();}
$('#musBtn').addEventListener('click',toggleMusic);
$('#sfxBtn').addEventListener('click',()=>{snd.sfx=!snd.sfx;try{localStorage.setItem(LS+'-snd',JSON.stringify({sfx:snd.sfx}));}catch(e){}drawSnd();if(snd.sfx)sfx('coin');});
drawSnd();

/* ============ СВЕТЛЯЧКИ И ИСКРЫ ============ */
const sky=$('#sky'),sx=sky.getContext('2d');let flies=[];
function fitSky(){const st=$('#stage');sky.width=st.clientWidth;sky.height=st.clientHeight;
  flies=Array.from({length:38},()=>({x:Math.random()*sky.width,y:Math.random()*sky.height,vx:(Math.random()-.5)*.25,vy:-(.05+Math.random()*.25),r:1+Math.random()*2.2,p:Math.random()*6.28,c:Math.random()<.5?'244,200,106':'185,164,255'}));}
function flyLoop(){sx.clearRect(0,0,sky.width,sky.height);flies.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.p+=.03;if(f.y<-10){f.y=sky.height+10;f.x=Math.random()*sky.width;}
    const a=.35+.35*Math.sin(f.p);const g=sx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*5);g.addColorStop(0,`rgba(${f.c},${a})`);g.addColorStop(1,`rgba(${f.c},0)`);
    sx.fillStyle=g;sx.beginPath();sx.arc(f.x,f.y,f.r*5,0,6.28);sx.fill();});requestAnimationFrame(flyLoop);}
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
function fit(){cv.width=innerWidth;cv.height=innerHeight;fitApp();fitSky();}addEventListener('resize',fit);fit();flyLoop();
function confetti(n){const cols=['#F4C86A','#FFE7A8','#B9A4FF','#7EE7FF'];
  for(let i=0;i<n;i++)parts.push({x:cv.width/2+(Math.random()-.5)*cv.width*.6,y:cv.height*.45,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:(2+Math.random()*3)*SCALE,c:cols[i%4],life:0});
  if(!raf)loop();}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.99;p.life++;
    cx.globalAlpha=Math.max(0,1-p.life/110);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.28);cx.fill();});cx.globalAlpha=1;
  parts=parts.filter(p=>p.life<110&&p.y<cv.height+20);raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),null);}

/* ============ СТАРТ ============ */
renderPlayersUI();refreshNames(false);renderKeybar();
go(Math.min(state.slide||0,slides.length-1));
const nj=document.getElementById('nojs');if(nj)nj.remove();
})();
